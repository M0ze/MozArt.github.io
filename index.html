
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MozArt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>MozArt</h1>
            <p>By Mugagga Moses</p>
        </div>
    </header>
    <nav>
        <div class="container">
            <!-- Navigation links can go here if needed -->
        </div>
    </nav>
    <section id="gallery-section" class="container">
        <div class="controls">
            <input type="text" id="search-input" placeholder="Search files...">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="image">Images</button>
                <button class="filter-btn" data-filter="pdf">PDFs</button>
            </div>
        </div>
        <main id="gallery">
            <!-- Content will be loaded here by JavaScript -->
        </main>
    </section>
    <footer>
        <div class="container">
            <p>&copy; 2026 MozArt. All rights reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
